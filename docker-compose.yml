# 공통(base) — 모든 환경이 공유하는 인프라(mysql + redis) 정의.
# 단독으로 쓰지 않고 dev/prod override 와 함께 사용한다.
#   개발: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   배포: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (DB_PASSWORD = MySQL root 비밀번호. 기본값 폴백을 없앴으므로 루트 .env 에 반드시 정의해야 한다.
#  약한 기본값 1234 로 조용히 기동되던 사고를 막기 위한 것 — dev 도 .env 파일이 필요하다.)
#
# 이미지 고정 규칙(모든 compose 파일 공통, PLATFORM 2절):
#   image 는 "버전태그@sha256:<멀티아치 index digest>" 로 쓰고 pull_policy: missing 을 붙인다.
#   태그만 두면 서버에 받아 둔 이미지가 무엇인지는 언제 처음 받았는지에 달려 있고, 새 서버에서는
#   그날의 태그 내용이 뜬다. digest 가 내용을 고정하므로 missing 이면 없을 때 그 digest 만 받는다.
#   digest 갱신은 Dependabot(docker-compose) PR 로 온다. 태그는 사람이 읽으라고 남긴다.
services:
  mysql:
    image: mysql:26.7@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4
    pull_policy: missing
    container_name: lol-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      MYSQL_DATABASE: loldb
    command: --innodb-buffer-pool-size=256M
    # data 망에만 둔다 — 웹 계층(nginx/frontend)에서 직접 도달 불가, 인터넷 egress 도 불가.
    networks:
      - data
    volumes:
      - mysql-data:/var/lib/mysql
      # 최소권한 계정 생성 스크립트. 볼륨을 새로 만들 때만 1회 실행되고, 필요한 값이
      # 없으면 스스로 건너뛴다(dev 는 그대로 root 폴백). 디렉터리 마운트라 inode 함정과 무관.
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?DB_PASSWORD required}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    pull_policy: missing
    container_name: lol-redis
    # 캐시 전용: 메모리 상한 + LRU 축출, 영속화 끔(꺼지면 캐시만 비워짐).
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - data
    mem_limit: 320m
    restart: unless-stopped

# ── 네트워크 2계층 분리 ──
#   default : 웹 계층(nginx ↔ frontend ↔ backend)
#   data    : 데이터 계층(backend ↔ mysql/redis) — 웹 계층에서 도달 불가
#   egress  : 인터넷 아웃바운드가 필요한 서비스 전용(egress-proxy=Riot API·ddragon)
#   edge    : server-infra 가 만드는 external 망. nginx 만 붙는다(docker-compose.prod.yml)
# default/data 의 internal 잠금은 docker-compose.netlock.yml 에서 한다(dev 는 잠그지 않아 호스트 포트 공개 유지).
networks:
  default:
  data:
  egress:

volumes:
  mysql-data:
