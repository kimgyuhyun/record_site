plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.recordsite'
version = '0.0.1-SNAPSHOT'
description = 'LoL Record Site Backend'

// 내장 톰캣만 따로 올린다. Spring Boot 3.5.11 이 끌고 오는 10.1.52 에 CRITICAL 6건이 있다
// (CVE-2026-41293/43512/43515/65182/65905/68525 — 대부분 인증·인가 우회).
// CI 의 Trivy 게이트가 이 이미지를 막아 세워서 발견했다.
//
// 부트 버전을 통째로 올리지 않고 이 속성만 덮는 이유: 6건이 전부 이 한 컴포넌트에 있고,
// 같은 10.1.x 안의 패치 업그레이드라 호환성 위험이 작다.
// spring-boot-dependencies 가 이 ext 속성을 읽어 BOM 값을 대체한다.
//
// ⚠️ 10.1.55 는 "지금 받을 수 있는 최신"이지 "전부 해소되는 버전"이 아니다.
//    41293/43512/43515 는 10.1.55 에서 고쳐졌지만, 65182/65905/68525 는 10.1.58 이 필요한데
//    그 버전이 아직 Maven Central 에 없다(확인: 10.1.55 가 최신). 10.1.58 이 올라오면
//    이 값을 올리고 Trivy 게이트가 초록으로 돌아오는지 확인할 것.
// 부트를 올릴 때 이 줄이 BOM 기본값보다 낮아지지 않는지도 확인할 것.
ext['tomcat.version'] = '10.1.55'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 요청 DTO 형식 검증(@Valid). 도메인 규칙 검증은 서비스에 그대로 두고, 형식만 경계에서 막는다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 헬스 체크 전용(actuator) — CD 배포 검증과 컨테이너 healthcheck 가 /actuator/health 로 UP 여부를 확인한다.
	// edge nginx 는 /actuator 를 프록시하지 않으므로 외부에는 노출되지 않는다(내부망 전용).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 노출용 Micrometer 레지스트리 — /actuator/prometheus 로 메트릭을 스크레이프 형식으로 내보낸다.
	// actuator 와 마찬가지로 내부망(default 망) 전용이라 Prometheus 컨테이너만 긁어간다.
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// Redis 캐시: 무거운 집계/정적 데이터 응답을 캐싱해 응답 지연·DB 부하를 줄인다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	// .env 파일의 값을 Spring 프로퍼티(${...})로 주입한다. 실제 시크릿은 git에 올리지 않는다.
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// Q클래스 생성 경로 설정
def generated = 'src/main/generated'

sourceSets {
	main.java.srcDirs += [generated]
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(generated))
}

clean {
	delete file(generated)
}

tasks.named('test') {
	useJUnitPlatform()
	def mockitoCoreJar = configurations.testRuntimeClasspath.find {
		it.name.startsWith('mockito-core') && it.name.endsWith('.jar')
	}
	jvmArgs "-javaagent:${mockitoCoreJar}", "-Xshare:off"
}
