# 배포용 override — 앱 컨테이너(backend/frontend/nginx)를 base 인프라 위에 얹는다.
# mysql/redis 는 내부 네트워크로만 접근하므로 호스트 포트를 열지 않는다(외부 노출 최소화).
#
#   기동: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   종료: docker compose -f docker-compose.yml -f docker-compose.prod.yml down
services:
  # 볼륨을 새로 만들 때 최소권한 계정을 자동 생성하기 위해 mysql 에도 같은 값을 넘긴다
  # (mysql/initdb/10-least-privilege.sh 가 읽는다). 계정명은 backend 쪽과 반드시 같아야 한다.
  # 이미 데이터가 있는 볼륨에서는 initdb 가 돌지 않으므로 운영 DB 에는 영향이 없다.
  mysql:
    environment:
      DB_APP_USER: loldb_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD required}
      DB_MIGRATE_USER: loldb_migrate
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:?DB_MIGRATE_PASSWORD required}

  # 운영에서만 Redis 인증을 건다(dev 는 base 의 무인증 command 를 그대로 쓴다 — localhost 전용).
  # :? 로 필수화한 이유: 빈 문자열이면 --requirepass 가 무인증으로 조용히 폴백한다.
  redis:
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""

  backend:
    build: ./backend
    container_name: lol-backend
    env_file:
      - ./.env                # RIOT_API_KEY, DB_PASSWORD (루트 .env 하나로 mysql 과 공유)
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      SPRING_CACHE_TYPE: redis
      # 최소권한: 런타임은 DML 전용 계정, 스키마 변경(Flyway)만 DDL 가능 계정을 쓴다.
      # root 는 앱이 더 이상 쓰지 않는다(mysql healthcheck 와 deploy.sh 의 mysqldump 만 계속 root).
      DB_APP_USER: loldb_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD required}
      DB_MIGRATE_USER: loldb_migrate
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:?DB_MIGRATE_PASSWORD required}
      # 팁 추천/신고 1인 1회 제약의 IP 해시 솔트. 값이 바뀌면 기존 이력과 매칭이 끊기므로 고정해서 쓴다.
      TIP_ACTOR_SALT: ${TIP_ACTOR_SALT:?TIP_ACTOR_SALT required}
      JAVA_OPTS: "-Xmx512m"
    # default(nginx 가 프록시) + data(mysql/redis). 인터넷 아웃바운드는 여기에 없다.
    #
    # ⚠️ egress 를 여기서 "빼둔" 것이 핵심이다. 아웃바운드는 netlock 오버레이가 붙이는
    #    proxy 망(허용목록 squid) 경유로만 나간다. compose 는 서비스의 networks 를
    #    합집합으로 병합하므로(실측 확인), 여기에 egress 를 남겨두면 netlock 이 proxy 를
    #    더해도 egress 가 그대로 남아 허용목록이 통째로 무력화된다 — 조용히.
    #
    #    그래서 이 파일만 단독으로 쓰면 backend 는 인터넷에 나갈 수 없고 Riot 호출이
    #    전부 실패한다. 의도된 fail-closed 다. 운영 조합의 정본은 scripts/deploy.sh 의
    #    COMPOSE 배열이며 거기에는 netlock 이 항상 들어 있다.
    networks:
      - default
      - data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 768m
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lol-frontend
    # 정적 SPA 서빙뿐 — 웹 계층만. DB 도 인터넷도 필요 없다.
    networks:
      - default
    mem_limit: 64m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lol-nginx
    environment:
      # 설정 파일 내용의 해시. nginx 는 설정을 단일 파일 bind mount 로 읽는데,
      # Docker 는 단일 파일 마운트를 inode 로 고정한다. CD 의 `git checkout -f` 는 파일을
      # 새 inode 로 갈아끼우므로, 컨테이너는 삭제된 옛 파일을 계속 붙들고 있게 된다
      # (`nginx -s reload` 도 같은 옛 inode 를 다시 읽어 소용없다).
      # 이 값이 바뀌면 compose 가 nginx 를 재생성해 새 파일을 다시 마운트한다.
      # deploy.sh 가 nginx/*.conf 를 해시해 주입한다.
      NGINX_CONF_SHA: ${NGINX_CONF_SHA:-unset}
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # egress 는 인터넷 용도가 아니라 필수 제약 때문이다: internal 망만 붙은 컨테이너는
    # 호스트 포트를 publish 할 수 없다 → 80/443 을 열려면 비-internal 망에 반드시 연결돼 있어야 한다.
    networks:
      - default
      - egress
    depends_on:
      - backend
      - frontend
    mem_limit: 64m
    restart: unless-stopped
