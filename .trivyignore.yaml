# Trivy 취약점 예외 목록.
#
# 여기 적은 것만 CI 게이트에서 건너뛴다. 나머지는 그대로 배포를 막는다.
# 예외를 추가할 때 지켜야 할 것:
#   1) 반드시 expired_at 을 넣는다. 날짜가 지나면 다시 빨간불이 되므로, 예외가 영구히
#      잊히지 않는다. 만료일 없는 예외는 "없앤 것"과 같다.
#   2) statement 에 "왜 지금 못 고치는지"와 "왜 그동안 감수할 만한지"를 둘 다 적는다.
#      둘 중 하나만 있으면 다음 사람이 판단을 다시 할 수 없다.
#   3) 고칠 수 있게 되면 예외를 지우고 버전을 올린다. 예외를 갱신하지 않는다.

vulnerabilities:
  # ── Spring Framework XsltView (backend 이미지의 app.jar) ──
  # 상황: Spring Boot 3.5.16 이 spring-webmvc 6.2.19 를 끌고 온다. 수정 버전은 7.0.9 뿐이고
  #       6.2.x 에는 무료 패치가 없다(GHSA-pc63-qcmh-9cmg). Boot 3.5 무료 지원은 2026-06-30 에
  #       끝났고 3.5.16 이 마지막이다. Framework 7 은 Boot 4 에서만 돌아가 ext 로 덮어쓸 수 없다.
  #       Boot 4 이전은 하지 않기로 했다 — 위 3) 의 "고칠 수 있게 되면" 이 오지 않는 경우다.
  #
  # 감수 근거: 취약점은 XsltView 를 뷰로 설정해 쓰는 앱에만 해당한다. 이 백엔드는 JSON API 만
  #       내고 XsltView·XSLT 를 쓰는 코드가 없으며(backend/src 검색 기준) 뷰 템플릿 의존성도 없다.
  #
  # 만료일: 고칠 날이 아니라 재검토일이다. 날짜가 지나면 XsltView 를 여전히 안 쓰는지,
  #       같은 이유로 막힌 Spring 취약점이 쌓였는지를 보고 다시 판단한다.
  - id: CVE-2026-47884
    statement: >-
      spring-webmvc 6.2.19: RCE via improper path limitation in XsltView. Fixed only in
      7.0.9; the 6.2 line has no OSS fix and Boot 3.5 (OSS support ended 2026-06-30) will
      not move to Framework 7, and a Boot 4 migration is out of scope. The backend serves
      JSON only and never configures XsltView or any XSLT view, so the vulnerable path is
      not reachable. Revisit on expiry.
    expired_at: 2027-04-07
