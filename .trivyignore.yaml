# Trivy 취약점 예외 목록.
#
# 여기 적은 것만 CI 게이트에서 건너뛴다. 나머지는 그대로 배포를 막는다.
# 예외를 추가할 때 지켜야 할 것:
#   1) 반드시 expired_at 을 넣는다. 날짜가 지나면 다시 빨간불이 되므로, 예외가 영구히
#      잊히지 않는다. 만료일 없는 예외는 "없앤 것"과 같다.
#   2) statement 에 "왜 지금 못 고치는지"와 "왜 그동안 감수할 만한지"를 둘 다 적는다.
#      둘 중 하나만 있으면 다음 사람이 판단을 다시 할 수 없다.
#   3) 고칠 수 있게 되면 예외를 지우고 버전을 올린다. 예외를 갱신하지 않는다.

vulnerabilities:
  # ── Apache Tomcat (backend 이미지에 내장) ──
  # 상황: Spring Boot 3.5.11 이 tomcat-embed-core 10.1.52 를 끌고 왔고 CRITICAL 6건이 나왔다.
  #       build.gradle 의 ext['tomcat.version'] 을 10.1.55 로 올려 3건은 해소했다.
  #       아래 3건은 수정 버전이 10.1.58 인데 그 아티팩트가 아직 Maven Central 에 없다
  #       (확인 시점 최신: 10.1.55). 즉 지금은 올릴 버전 자체가 존재하지 않는다.
  #
  # 감수 근거: 세 건 모두 톰캣의 인증/보안 제약(security constraint) 우회 계열인데,
  #       이 서비스에는 로그인 기능이 없고(CLAUDE.md) 톰캣에 security constraint 를
  #       설정한 곳도 없다. 우회 대상이 되는 인증·인가 자체가 구성돼 있지 않다.
  #       또한 backend 는 엣지 nginx 뒤에 있고 호스트로 포트를 열지 않는다.
  #
  # 해제 방법: 10.1.58 이 Maven Central 에 올라오면 build.gradle 의 tomcat.version 을
  #       올리고 이 블록 전체를 지운다. 아래 만료일이 지나면 CI 가 다시 막으므로,
  #       그때까지 안 나왔으면 상황을 다시 판단한다.
  - id: CVE-2026-65182
    statement: >-
      tomcat-embed-core: security constraint bypass. Fixed in 10.1.58, which is not
      published to Maven Central yet (10.1.55 is the newest available). This service
      configures no security constraints and has no login, so there is no constraint
      to bypass. Revisit when 10.1.58 ships.
    expired_at: 2026-10-31

  - id: CVE-2026-65905
    statement: >-
      tomcat-embed-core: authentication bypass. Fixed in 10.1.58, not published yet.
      This service has no authentication at all, so there is nothing to bypass.
      Revisit when 10.1.58 ships.
    expired_at: 2026-10-31

  - id: CVE-2026-68525
    statement: >-
      tomcat-embed-core: unauthorized access. Fixed in 10.1.58, not published yet.
      Same reasoning as the two above; backend sits behind the edge nginx and
      publishes no host port. Revisit when 10.1.58 ships.
    expired_at: 2026-10-31
