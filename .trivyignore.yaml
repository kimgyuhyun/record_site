# Trivy 취약점 예외 목록.
#
# 여기 적은 것만 CI 게이트에서 건너뛴다. 나머지는 그대로 배포를 막는다.
# 예외를 추가할 때 지켜야 할 것:
#   1) 반드시 expired_at 을 넣는다. 날짜가 지나면 다시 빨간불이 되므로, 예외가 영구히
#      잊히지 않는다. 만료일 없는 예외는 "없앤 것"과 같다.
#   2) statement 에 "왜 지금 못 고치는지"와 "왜 그동안 감수할 만한지"를 둘 다 적는다.
#      둘 중 하나만 있으면 다음 사람이 판단을 다시 할 수 없다.
#   3) 고칠 수 있게 되면 예외를 지우고 버전을 올린다. 예외를 갱신하지 않는다.

