# ============================================================================
# egress-proxy (squid) — 허용목록 기반 HTTP/HTTPS 포워드 프록시. 기본 거부.
# ----------------------------------------------------------------------------
# 왜 두는가 (PLATFORM 3절 [상황] "아웃바운드 통신을 제어한다"):
#   망 분리는 아웃바운드가 "필요 없는" 서비스를 끊을 뿐, egress 망에 붙은 서비스의
#   목적지는 제한하지 못한다. backend 는 egress 망에 통째로 붙어 있어서 침해되면
#   DB 를 읽어 어디로든 보낼 수 있었다(backend 는 data 망에도 있다).
#   그래서 backend 를 egress 에서 빼고 internal 인 proxy 망에 두고, 아웃바운드는
#   전부 여기를 거치게 한다. 여기 없는 목적지는 나갈 수 없다.
#
#   2026-06 OTT 침해에서 확인된 대로 마이너·드로퍼는 반드시 밖으로 나가야 동작한다.
#   이것이 컨테이너가 뚫린 뒤의 마지막 방어선이다.
#
# 허용 목록의 근거:
#   backend 소스 전체에서 실제로 접속하는 외부 호스트는 아래 셋뿐이다.
#     kr.api.riotgames.com     소환사·매치·리그·스펙테이터 API
#     asia.api.riotgames.com   account-v1, match-v5
#     ddragon.leagueoflegends.com  챔피언·아이템·룬 정적 데이터
#   MySQL·Redis 는 data 망 내부 통신이라 프록시와 무관하다.
#   목록을 늘릴 때는 "코드가 실제로 소켓을 여는 호스트"만 넣는다 —
#   브라우저가 가는 주소는 backend 가 접속하지 않으므로 넣지 않는다.
#
# ⚠️ 절대 넣지 말 것: ssl_bump / SslBump.
#   HTTPS 는 CONNECT 줄의 평문 호스트명으로 판정한다. TLS 를 가로채도 얻는 것이 없고,
#   대신 MITM CA 를 경로에 심게 된다.
# ============================================================================
http_port 3128
visible_hostname egress-proxy

acl allowed_dst dstdomain kr.api.riotgames.com asia.api.riotgames.com ddragon.leagueoflegends.com
acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

# 순서를 바꾸지 말 것. deny 가 먼저 오고, allow 는 허용 목록에만 걸리고,
# 마지막 deny all 이 나머지 전부를 막는다.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

# 캐시를 쓰지 않는다 — Riot 응답은 앱이 Redis 로 캐싱하고, 여기서 또 캐싱하면
# 레이트리밋 회계와 어긋난다. 이 컨테이너의 역할은 통제이지 성능이 아니다.
cache deny all
# cache_mem 은 캐시를 꺼도 공유메모리 세그먼트를 잡는다. 컨테이너 기본 /dev/shm 이
# 64MB 라 기본값(256MB)이면 기동에 실패한다.
cache_mem 8 MB
pid_filename none
# ICMP pinger 는 캐시 피어 간 RTT 측정용이라 여기서는 쓸 일이 없다. 켜두면 raw 소켓을
# 열려다 실패하고(비특권 실행 + cap 0) 기동할 때마다 FATAL 로그를 남긴다.
pinger_enable off

# 로그는 stdout/stderr 로 — Alloy 가 도커 json-file 로그를 읽어 Loki 로 넘긴다.
# 차단된 목적지는 access_log 에 TCP_DENIED 로 남으므로 침해 시 시도 흔적이 보인다.
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr
