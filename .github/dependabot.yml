version: 2
updates:
  # 프론트엔드 (React + Vite / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]
      # 보안 PR 도 하나로 묶는다. 이 파일이 있으면 저장소 설정의 Grouped security updates 가 아니라
      # 여기 그룹을 따른다 — 그룹이 없을 때 보안 PR 이 패키지마다 따로 왔다(머지 1번 = 배포 1번).
      # 보안 PR 은 아래 ignore 의 update-types 를 따르지 않는다. 고치는 버전이 메이저면 메이저로 온다.
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # 메이저 버전 업그레이드는 breaking change 위험이 커서 자동 PR 제외(수동 처리)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 백엔드 (Spring Boot / gradle)
  # build.gradle 의 ext['tomcat.version']·ext['netty.version'] 은 Dependabot 이 관리하지 않는다.
  # 부트 버전 PR 을 받으면 BOM 기본값이 이 덮어쓴 값보다 높아지지 않았는지 확인한다.
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-minor:
        update-types: ["minor", "patch"]
      # 보안 PR 묶음 — 이유는 위 frontend-security 와 같다.
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # 메이저 버전 업그레이드는 breaking change 위험이 커서 자동 PR 제외(수동 처리)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── 메이저 정책: npm·gradle 과 docker·github-actions 가 다르다 ──
  # 위 npm·gradle 은 메이저를 무시한다. 라이브러리 메이저는 API 가 바뀌어 코드 수정이 따라오고,
  # 무시해도 지금 쓰는 메이저가 계속 패치를 받는다.
  # 아래 docker·github-actions 는 메이저를 무시하지 않는다. 여기서 메이저는 런타임·플랫폼
  # (Node, JDK, 액션 런타임) 세대라, 막아 두면 그 세대가 EOL 이 돼도 PR 이 오지 않고 조용히
  # 갇힌다(node:20-alpine 이 그렇게 EOL 까지 남아 있었다).
  # 그 결과 eclipse-temurin 25, node 26, actions/checkout 상위 메이저 같은 PR 이 온다.
  # 메이저 PR 은 자동 머지하지 않는다(PLATFORM 6절) — 릴리스 노트와 CI 결과를 보고 손으로 머지한다.

  # Docker 베이스 이미지
  # npm/gradle과 달리 Docker는 advisory 매핑이 없어 security update PR이 따로 오지 않는다.
  # 이 스케줄이 곧 유일한 패치 주기이므로 daily로 둔다(다이제스트가 실제로 움직일 때만 PR이 열린다).
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "daily"

  # compose 이미지(mysql·redis·nginx·squid·관측 스택). 루트의 docker-compose*.yml 이 대상이다.
  # 위 "docker" 는 Dockerfile 만 읽고 compose 파일은 보지 않는다. 이게 없으면 compose 의
  # tag@digest 고정이 갱신 경로 없이 그대로 굳는다. 주기·메이저 정책은 docker 와 같다.
  # mysql·redis 메이저 PR(데이터 형식이 바뀌는 업그레이드)은 특히 그대로 머지하지 않는다.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"

  # GitHub Actions 워크플로우
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
