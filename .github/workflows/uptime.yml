## 업타임 모니터 — 호스트 "밖"에서 서비스 접근성을 확인한다 (PLATFORM 9절 [절대]).
##
## 왜 별도인가:
##   scripts/watchdog.sh 는 서버 안에서 돈다. 서버가 통째로 죽거나(오라클 인스턴스 회수,
##   커널 패닉, 네트워크 단절) 호스트가 침해되면 그 감시도 같이 죽어서 아무 말이 없다.
##   "조용하다"와 "정상이다"를 구분하려면 밖에서 보는 눈이 하나 더 있어야 한다.
##
## 왜 GitHub Actions 인가:
##   외부 SaaS 모니터를 하나 더 붙이지 않고, 이미 쓰는 인프라로 끝낸다. 러너는 서버와
##   완전히 다른 네트워크에 있으므로 "호스트 밖" 요건을 만족한다.
##
## 한계(알고 쓰는 것):
##   - schedule 은 best-effort 다. 혼잡하면 10분 이상 밀린다 — 초 단위 SLA 감시용이 아니다.
##   - 공개 저장소의 schedule 은 60일간 커밋이 없으면 자동 비활성화된다. 그때는
##     Actions 탭에서 수동으로 다시 켜야 한다.
##   둘 다 "장애를 몇 분 늦게 아는" 문제이지 "모르는" 문제는 아니라서 이 비용을 받아들인다.
name: Uptime (external probe)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live site
        id: probe
        run: |
          url="https://kdagg.kozow.com"
          # 3회까지 재시도한다. 1회 실패로 알리면 순간적인 네트워크 요동에도 경보가 울리고,
          # 그런 경보는 곧 무시된다(PLATFORM 9절).
          for i in 1 2 3; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # if 로 쓴다: `[ ... ] && sleep` 은 마지막 회차에 거짓이 되고, 러너의
            # 기본 셸이 bash -e 라 그 자리에서 스텝이 끝나 last_code 를 못 남긴다.
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          echo "last_code=$code" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          LAST_CODE: ${{ steps.probe.outputs.last_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 웹훅이 없으면 잡 실패로만 남긴다 — 알림 실패가 모니터 자체를 가리지 않게.
          if [ -z "$WEBHOOK" ]; then
            echo "ALERT_WEBHOOK_URL 시크릿이 없어 알림을 보내지 못했다"
            exit 1
          fi
          body="**[record_site] 외부 접근 실패**
https://kdagg.kozow.com 이 3회 연속 200 이 아닙니다 (마지막 응답: ${LAST_CODE:-none}).
서버 안 워치독이 조용하다면 호스트 자체가 죽었을 수 있습니다.
실행 로그: $RUN_URL"
          # --arg 로 넘겨 따옴표·개행이 섞여도 JSON 이 깨지지 않게 한다.
          jq -n --arg c "$body" '{content:$c}' \
            | curl -sS -m 10 -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
