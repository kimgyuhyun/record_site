## CI — arm64 이미지 빌드 후 GHCR(비공개)에 푸시.
## 서버가 aarch64 이므로 GitHub-hosted ARM 러너에서 네이티브 arm64 로 빌드한다(QEMU 크로스빌드 불필요).
## 인증은 워크플로 GITHUB_TOKEN(단기) 만 사용 — 별도 시크릿 없음. 이미지 태그 = commit-sha(불변) + latest(편의).
name: CI (build & push images)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 는 소유자/이미지명이 소문자여야 한다. kimgyuhyun / record_site-* 모두 소문자라 그대로 사용.
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/record_site-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/record_site-frontend

jobs:
  # 백엔드 테스트. 이미지 빌드는 bootJar -x test 로 테스트를 건너뛰므로 검증은 여기서만 일어난다.
  # 동시성 테스트(ChampionTipConcurrencyTest)는 실제 행 잠금 동작을 보기 때문에 진짜 MySQL 이 필요하다
  # (H2 로는 재현되지 않는다). 그래서 서비스 컨테이너로 MySQL·Redis 를 띄운다.
  test:
    runs-on: ubuntu-latest         # 테스트는 아키텍처와 무관하므로 값싼 x86 러너를 쓴다.
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: loldb
        ports:
          - 3307:3306              # application.yaml 의 로컬 기본 포트(3307)에 맞춘다.
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests
        working-directory: ./backend
        env:
          DB_PASSWORD: ci
          # 애플리케이션 기동에만 필요하고 테스트가 Riot 을 호출하지는 않는다(실키 불필요).
          RIOT_API_KEY: ci-dummy-key
        run: chmod +x gradlew && ./gradlew test --no-daemon

      # 실패 원인을 러너 로그만으로 좇기 어려우므로 리포트를 남긴다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  build:
    needs: test                    # 테스트가 깨지면 이미지를 만들지 않는다 → CD 도 트리거되지 않는다.
    runs-on: ubuntu-24.04-arm      # GitHub-hosted ARM(에페메럴·격리). 서버 arm64 와 동일 아키텍처.
    permissions:
      contents: read
      packages: write              # GHCR 푸시 권한(GITHUB_TOKEN 에 부여)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 취약점 스캔 게이트. 종전에는 report-only(`--exit-code 0` + `|| true`)라 CRITICAL 이
      # 있어도 그대로 배포됐다 — 결과를 아무도 안 보면 스캔은 있으나 마나다. 이제 실패시킨다:
      # CI 가 실패하면 이미지가 push 되지 않고, CD 는 CI 성공에만 걸려 있으므로 배포가 막힌다.
      #
      # 기준 calibration:
      #   severity CRITICAL      HIGH 까지 막으면 베이스 이미지 사정으로 상시 빨간불이 된다.
      #   ignore-unfixed true    패치가 없는 취약점은 고칠 방법이 없어 막아도 무한 실패만 남는다.
      #                          "고칠 수 있는데 안 고친 CRITICAL" 만 배포를 막는다.
      #
      # 설치를 `curl | sudo sh` 로 하던 것도 걷어냈다. main 브랜치의 스크립트를 검증 없이
      # root 로 실행하던 것인데, 이 잡은 GHCR push 권한 토큰을 쥐고 있어 이미지 오염 경로가 된다.
      # 액션은 커밋 SHA 로 고정한다(태그는 재지정될 수 있다).
      # TRIVY_PLATFORM 이 필요한 이유: 여기서 만드는 이미지는 linux/arm64 하나뿐이다
      # (서버가 aarch64 라 멀티아치를 만들지 않는다). buildx 는 push 만 하고 로컬 도커에
      # 이미지를 남기지 않으므로 Trivy 는 레지스트리에서 받아오는데, 그때 기본값인
      # linux/amd64 자식을 찾다가 "no child with platform linux/amd64" 로 죽는다.
      # (종전 `curl | sh` 설치 방식은 arm 러너에 arm64 바이너리가 깔려 우연히 맞았던 것이다.)
      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          # 예외 목록은 파일 하나로 모은다. 각 항목에 만료일이 있어 날짜가 지나면
          # 자동으로 다시 배포를 막는다 — 예외가 영구히 잊히지 않게 하는 장치다.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          # 예외 목록은 파일 하나로 모은다. 각 항목에 만료일이 있어 날짜가 지나면
          # 자동으로 다시 배포를 막는다 — 예외가 영구히 잊히지 않게 하는 장치다.
          trivyignores: .trivyignore.yaml
          exit-code: '1'
